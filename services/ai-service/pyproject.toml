[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docling>=2.115.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "langchain-community>=0.4.2",
    "langchain-docling>=2.0.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.9",
    "langsmith>=0.10.10",
    "logfire[fastapi,system-metrics]>=4.38.0",
    "nemoguardrails>=0.23.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "prometheus-client>=0.25.0",
    "pydantic>=2.13.4",
    "pydantic-evals[logfire]>=2.16.0",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.1",
    "slowapi>=0.1.10",
    "structlog>=26.1.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["smoke: Core integration tests for critical paths"]

ignore_no_config=true
